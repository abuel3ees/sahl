# Local development services for Sahl. Start with `docker compose up -d`.
#
# The database and the OpenTelemetry Collector run in containers; PHP and Vite run on the Mac
# (`php artisan serve --port=8123`, `npm run dev`). On Azure the same role is
# played by Azure Database for PostgreSQL (Flexible Server), version 17.

name: sahl

services:
  pgsql:
    # Same major version as Azure Database for PostgreSQL, so local behaves like the cloud.
    image: postgres:17-alpine
    ports:
      # Override with FORWARD_DB_PORT in .env if 5432 is taken on the Mac.
      - "${FORWARD_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: "${DB_DATABASE:-sahl}"
      POSTGRES_USER: "${DB_USERNAME:-sahl}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-secret}"
    volumes:
      # Data survives `docker compose down`; `docker compose down -v` wipes it.
      - sahl-pgsql:/var/lib/postgresql/data
    configs:
      # Runs once, on the first start with an empty volume: the database the test suite uses.
      - source: create-testing-database
        target: /docker-entrypoint-initdb.d/10-create-testing-database.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${DB_DATABASE:-sahl}", "-U", "${DB_USERNAME:-sahl}"]
      interval: 5s
      timeout: 5s
      retries: 10

  otel:
    # OpenTelemetry Collector: receives Laravel's traces and prints them (`docker compose logs -f otel`).
    # On Azure the same job is done by an App Service sidecar that sends them to Application Insights.
    image: otel/opentelemetry-collector-contrib:0.161.0
    ports:
      - "4318:4318" # OTLP over HTTP
    configs:
      # The contrib image reads its config from this path.
      - source: otel-collector
        target: /etc/otelcol-contrib/config.yaml

configs:
  otel-collector:
    file: ./infra/otel/collector.local.yaml
  create-testing-database:
    content: |
      SELECT 'CREATE DATABASE sahl_testing'
      WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'sahl_testing')\gexec

volumes:
  sahl-pgsql:
